<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="input-values">
    <button onclick="
    let s = document.querySelector('#input-values').value;
    if(s.trim() !== ''){
        let li = document.createElement('li');
        li.innerText = s;
        document.querySelector('#unorderlist').appendChild(li);
         document.getElementById('input-values').value = '';
       
    }
    
    
    
    ">Add</button>
    <button onclick="document.querySelector('#unorderlist').innerHTML = '';">clear all</button>

    <ul id="unorderlist">
        
    </ul>
    
</body>
</html>
