<!DOCTYPE html>
<html lang="en">
<head>

    <title>Rock Paper Scissor Game</title>

    <style>
        body{
            width: 500px;
            border: 1.5px solid rgb(117, 113, 113);
        }
        .hello
        {
            color: green;

        }

            border: none;
            margin-left: 50px;
            /* padding: 5px 25px; */

        .DIV
        {
            display: flex;
            justify-content: center;
        }
     img{
        width: 70px;
        height: 60px;
     }

    </style>
</head>
<body>
    <div>
        <header> 
            <h1>ROCK PAPER SCISSOR GAME</h1> 
        </header>
    </div>
    <br>
    <div>
        <h1 id="System-Output3"></h1>
    </div>
    <div>
        <h1 id="System-Output"></h1>
    </div>
    <div>
        <h1 id="System-Output1"></h1>

    <h1 id="System-Output1"></h1>
  
    <h1 class="hello" id="System-Output2"></h1>

    <div>
        <h1>CHOICE ANY ONE </h1>
    </div>
    <div class="DIV">

    <button class="Buttons" id="stone-Button" onclick="
        Randomnumber = Math.random() * 3;
        ComputerChoice = '';
        document.querySelector('#System-Output').innerText = 'YOU CHOICE ROCK';
        number();
        document.querySelector('#System-Output1').innerText = (`COMPUTER CHOICE ${ComputerChoice}`);

        if(ComputerChoice === 'ROCK'){
            document.querySelector('#System-Output2').innerText = 'MATCH TIE';
            score.Match_tie++;
        }
        if(ComputerChoice === 'PAPER'){
            document.querySelector('#System-Output2').innerText = 'COMPUTER WIN';
            score.Lost++;
        }
        if(ComputerChoice === 'SCISSOR'){
            document.querySelector('#System-Output2').innerText = 'YOU WIN';
            score.Win++;
                   
        }

        "><img src="images/rock.webp" alt="rock"></button>

        <button class="Buttons" onclick="
        Randomnumber = Math.random() * 3;
        ComputerChoice = '';
        document.querySelector('#System-Output').innerText = 'YOU CHOICE PAPER';
        number();
        document.querySelector('#System-Output1').innerText = (`COMPUTER CHOICE ${ComputerChoice}`);

        if(ComputerChoice === 'ROCK'){
            document.querySelector('#System-Output2').innerText = 'YOU WIN';
            score.Win++;
                     
                     
        }
        if(ComputerChoice === 'PAPER'){
            document.querySelector('#System-Output2').innerText = 'MATCH TIE';
            score.Match_tie++;
        }
        if(ComputerChoice === 'SCISSOR'){
            document.querySelector('#System-Output2').innerText = 'COMPUTER WIN';
            score.Lost++;
        }
        " ><img src="images/paper.png" alt="paper"></button>
        <button class="Buttons" onclick="
        Randomnumber = Math.random() * 3;
        ComputerChoice = '';
        document.querySelector('#System-Output').innerText ='YOU CHOICE SCISSOR';
        number();
        document.querySelector('#System-Output1').innerText = (`COMPUTER CHOICE ${ComputerChoice}`);

        if(ComputerChoice === 'ROCK'){
            document.querySelector('#System-Output2').innerText = 'COMPUTER WIN';
            score.Lost++;
        }
        if(ComputerChoice === 'PAPER'){
            document.querySelector('#System-Output2').innerText = 'YOU WIN';
            score.Win++;
         
        }
        if(ComputerChoice === 'SCISSOR'){
            document.querySelector('#System-Output2').innerText = 'MATCH TIE';
            score.Match_tie++;
        }

        "><img src="images/scissor.jpg" alt="scissor"></button>
        </div>

        



    <script>
        let Randomnumber = Math.random() * 3;
        let ComputerChoice = '';

       
        let score = {
            Win: 0,
            Match_tie : 0,
            Lost: 0,
        }

        console.log(`your win:${score.Win} Your Lost:${score.Lost} Your Match_tie:${score.Match_tie}`);
       

        function number()
        {
            if(Randomnumber > 0 && Randomnumber <= 1)
        {
            ComputerChoice = 'ROCK';
        }
        if(Randomnumber > 1 && Randomnumber <= 2)
        {
            ComputerChoice = 'PAPER';
        }
        if(Randomnumber > 2 && Randomnumber <= 3)
        {
            ComputerChoice = 'SCISSOR';
        }

        }
   
        
        // if( ComputerChoice === 'Paper' && ComputerChoice === 'Scissor' )

    </script>
